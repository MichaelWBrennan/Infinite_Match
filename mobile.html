<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #mobile-cursor-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 1000;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #mobile-cursor-prompt h1 {
            margin: 0 0 20px 0;
            font-size: 32px;
            font-weight: 600;
        }

        #mobile-cursor-prompt p {
            margin: 0 0 30px 0;
            font-size: 18px;
            opacity: 0.9;
        }

        .tap-indicator {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            margin-top: 20px;
        }

        .tap-indicator::before {
            content: '👆';
            font-size: 24px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #unityContainer {
            width: 100%;
            height: 100%;
            display: none; /* hidden until user taps */
            position: relative;
        }

        #unityContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1001;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 80%;
            z-index: 1002;
        }

        /* Mobile-specific optimizations */
        @media (max-width: 768px) {
            #mobile-cursor-prompt h1 {
                font-size: 28px;
            }
            
            #mobile-cursor-prompt p {
                font-size: 16px;
            }
            
            .tap-indicator {
                width: 50px;
                height: 50px;
            }
        }

        /* Prevent zoom on double tap */
        * {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="mobile-cursor-prompt">
        <h1>🎮 Unity Game</h1>
        <p>Tap the screen to start playing</p>
        <div class="tap-indicator"></div>
    </div>
    
    <div id="unityContainer">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Game...</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        const prompt = document.getElementById("mobile-cursor-prompt");
        const unityContainer = document.getElementById("unityContainer");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const progressBar = document.getElementById("progressBar");
        const loadingText = document.querySelector(".loading-text");

        let unityInstance = null;
        let isGameLoaded = false;

        // Function to resize Unity container on orientation change or window resize
        function resizeUnity() {
            if (unityInstance && unityInstance.Module && unityInstance.Module.canvas) {
                const canvas = unityInstance.Module.canvas;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                
                // Notify Unity about the resize
                if (unityInstance.SendMessage) {
                    unityInstance.SendMessage("GameManager", "OnScreenResize", 
                        JSON.stringify({
                            width: window.innerWidth,
                            height: window.innerHeight
                        })
                    );
                }
            }
        }

        // Handle orientation change with delay
        function handleOrientationChange() {
            setTimeout(() => {
                resizeUnity();
            }, 100);
        }

        window.addEventListener("resize", resizeUnity);
        window.addEventListener("orientationchange", handleOrientationChange);

        // Prevent context menu on long press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Prevent text selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        // Start game when user taps
        prompt.addEventListener("click", startGame);
        prompt.addEventListener("touchend", startGame);

        // Prevent multiple starts
        function startGame() {
            if (isGameLoaded) return;
            
            // Hide prompt and show Unity container
            prompt.style.display = "none";
            unityContainer.style.display = "block";
            loadingOverlay.style.display = "flex";

            // Resize to full screen
            resizeUnity();

            // Load Unity WebGL build
            loadUnityGame();
        }

        function loadUnityGame() {
            // Load the Unity loader script
            const script = document.createElement("script");
            script.src = "WebGL.loader.js";
            
            script.onload = () => {
                console.log('📦 Unity loader loaded, initializing...');
                
                // Create Unity instance with progress callback
                if (typeof createUnityInstance === 'function') {
                    createUnityInstance(unityContainer, {
                        dataUrl: "WebGL.data",
                        frameworkUrl: "WebGL.framework.js",
                        codeUrl: "WebGL.wasm",
                        memoryUrl: "WebGL.mem",
                        streamingAssetsUrl: "StreamingAssets",
                        companyName: "Infinite Match",
                        productName: "Unity WebGL Mobile",
                        productVersion: "1.0",
                        devicePixelRatio: window.devicePixelRatio || 1,
                        matchWebGLToCanvasSize: false
                    }, (progress) => {
                        const percentage = Math.round(progress * 100);
                        progressBar.style.width = percentage + "%";
                        loadingText.textContent = `Loading Game... ${percentage}%`;
                        console.log('📊 Loading progress:', percentage + '%');
                    }).then((instance) => {
                        unityInstance = instance;
                        isGameLoaded = true;
                        
                        // Hide loading overlay
                        loadingOverlay.style.display = "none";
                        
                        // Set up fullscreen functionality
                        if (unityInstance.SetFullscreen) {
                            unityContainer.addEventListener('dblclick', () => {
                                unityInstance.SetFullscreen(1);
                            });
                        }
                        
                        // Set up touch events for mobile
                        setupMobileControls();
                        
                        // Initial resize
                        resizeUnity();
                        
                        console.log('✅ Unity game loaded successfully');
                    }).catch((message) => {
                        console.error('❌ Unity game load failed:', message);
                        showError('Failed to load game: ' + message);
                    });
                } else {
                    console.error('❌ createUnityInstance function not found');
                    showError('Unity loader not properly loaded');
                }
            };
            
            script.onerror = () => {
                console.error('❌ Failed to load Unity WebGL loader');
                showError('Failed to load Unity loader. Please check your build files.');
            };
            
            document.body.appendChild(script);
        }

        function setupMobileControls() {
            // Add mobile-specific touch controls if needed
            const canvas = unityContainer.querySelector('canvas');
            if (canvas) {
                // Prevent default touch behaviors
                canvas.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                }, { passive: false });
                
                canvas.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
                
                canvas.addEventListener('touchend', function(e) {
                    e.preventDefault();
                }, { passive: false });
            }
        }

        function showError(message) {
            loadingOverlay.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                    <button onclick="location.reload()" style="
                        background: #667eea;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        margin-top: 10px;
                        cursor: pointer;
                    ">Retry</button>
                </div>
            `;
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Game paused
                if (unityInstance && unityInstance.SendMessage) {
                    unityInstance.SendMessage("GameManager", "OnGamePause", "");
                }
            } else {
                // Game resumed
                if (unityInstance && unityInstance.SendMessage) {
                    unityInstance.SendMessage("GameManager", "OnGameResume", "");
                }
            }
        });

        // Handle page unload
        window.addEventListener('beforeunload', function() {
            if (unityInstance && unityInstance.SendMessage) {
                unityInstance.SendMessage("GameManager", "OnGameQuit", "");
            }
        });

        // Prevent pull-to-refresh on mobile
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
