<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
        }
        .success { background: rgba(76, 175, 80, 0.3); }
        .error { background: rgba(244, 67, 54, 0.3); }
        .warning { background: rgba(255, 152, 0, 0.3); }
        button {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #44a08d;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎮 Loading Fix Test</h1>
        <p>This page tests the loading screen fixes and optimizations.</p>
        
        <div id="test-results">
            <div class="test-result" id="webgl-test">
                <h3>WebGL File Detection Test</h3>
                <p id="webgl-result">Testing...</p>
            </div>
            
            <div class="test-result" id="game-init-test">
                <h3>Game Initialization Test</h3>
                <p id="game-init-result">Testing...</p>
            </div>
            
            <div class="test-result" id="platform-test">
                <h3>Platform Detection Test</h3>
                <p id="platform-result">Testing...</p>
            </div>
            
            <div class="test-result" id="loading-test">
                <h3>Loading Sequence Test</h3>
                <p id="loading-result">Testing...</p>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="runTests()">🔄 Run Tests Again</button>
            <button onclick="testLoadingSequence()">⏱️ Test Loading Sequence</button>
            <button onclick="window.open('index.html', '_blank')">🎮 Open Main Game</button>
        </div>
    </div>

    <script>
        // Test WebGL file detection
        async function testWebGLFiles() {
            try {
                const dataUrl = "Build/WebGL.data";
                const wasmUrl = "Build/WebGL.wasm";
                
                const dataResponse = await fetch(dataUrl, { method: 'HEAD' });
                const wasmResponse = await fetch(wasmUrl, { method: 'HEAD' });
                
                if (!dataResponse.ok || !wasmResponse.ok) {
                    return { success: false, message: 'WebGL files not found - using fallback' };
                }
                
                const dataSize = parseInt(dataResponse.headers.get('content-length') || '0');
                const wasmSize = parseInt(wasmResponse.headers.get('content-length') || '0');
                
                if (dataSize < 1000 || wasmSize < 1000) {
                    return { success: false, message: 'WebGL files are placeholders - using fallback' };
                }
                
                return { success: true, message: `WebGL files valid (Data: ${dataSize} bytes, WASM: ${wasmSize} bytes)` };
            } catch (error) {
                return { success: false, message: `Error checking WebGL files: ${error.message}` };
            }
        }
        
        // Test game initialization
        function testGameInit() {
            try {
                // Check if game class exists
                if (typeof InfiniteMatchGame === 'undefined') {
                    return { success: false, message: 'InfiniteMatchGame class not found' };
                }
                
                // Try to create game instance
                const game = new InfiniteMatchGame();
                if (game && typeof game.showScreen === 'function') {
                    return { success: true, message: 'Game initialized successfully' };
                } else {
                    return { success: false, message: 'Game instance created but methods missing' };
                }
            } catch (error) {
                return { success: false, message: `Game initialization failed: ${error.message}` };
            }
        }
        
        // Test platform detection
        function testPlatformDetection() {
            const platformInfo = {
                isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
                isTouch: 'ontouchstart' in window,
                hasWebGL: !!window.WebGLRenderingContext,
                hasWebGL2: !!window.WebGL2RenderingContext,
                isLowEnd: navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4,
                userAgent: navigator.userAgent
            };
            
            return {
                success: true,
                message: `Platform: ${platformInfo.isMobile ? 'Mobile' : 'Desktop'}, Touch: ${platformInfo.isTouch}, WebGL: ${platformInfo.hasWebGL}, Low-end: ${platformInfo.isLowEnd}`
            };
        }
        
        // Test loading sequence
        function testLoadingSequence() {
            return new Promise((resolve) => {
                const loadingSteps = [
                    { progress: 20, text: 'Initializing...', delay: 200 },
                    { progress: 40, text: 'Loading assets...', delay: 300 },
                    { progress: 60, text: 'Setting up UI...', delay: 200 },
                    { progress: 80, text: 'Finalizing...', delay: 200 },
                    { progress: 100, text: 'Complete!', delay: 100 }
                ];
                
                let currentStep = 0;
                const runNextStep = () => {
                    if (currentStep < loadingSteps.length) {
                        const step = loadingSteps[currentStep];
                        console.log(`Loading: ${step.progress}% - ${step.text}`);
                        currentStep++;
                        setTimeout(runNextStep, step.delay);
                    } else {
                        resolve({ success: true, message: 'Loading sequence completed successfully' });
                    }
                };
                
                runNextStep();
            });
        }
        
        // Update test result display
        function updateTestResult(elementId, result) {
            const element = document.getElementById(elementId);
            const resultElement = element.querySelector('p');
            
            element.className = `test-result ${result.success ? 'success' : 'error'}`;
            resultElement.textContent = result.message;
        }
        
        // Run all tests
        async function runTests() {
            console.log('🧪 Running loading fix tests...');
            
            // Test WebGL files
            const webglResult = await testWebGLFiles();
            updateTestResult('webgl-test', webglResult);
            
            // Test game initialization
            const gameInitResult = testGameInit();
            updateTestResult('game-init-test', gameInitResult);
            
            // Test platform detection
            const platformResult = testPlatformDetection();
            updateTestResult('platform-test', platformResult);
            
            // Test loading sequence
            const loadingResult = await testLoadingSequence();
            updateTestResult('loading-test', loadingResult);
            
            console.log('✅ All tests completed');
        }
        
        // Run tests on page load
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
