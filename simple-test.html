<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .test-button {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .log {
            background: rgba(0,0,0,0.5);
            color: #0f0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            width: 80%;
            max-width: 600px;
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Button Functionality Test</h1>
    
    <div class="status" id="status">
        Status: Initializing...
    </div>
    
    <button class="test-button" onclick="testButton1()">Test Button 1</button>
    <button class="test-button" onclick="testButton2()">Test Button 2</button>
    <button class="test-button" onclick="testButton3()">Test Button 3</button>
    
    <div class="log" id="log"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = 'Status: ' + message;
        }

        function testButton1() {
            log('✅ Button 1 clicked successfully!');
            updateStatus('Button 1 clicked');
        }

        function testButton2() {
            log('✅ Button 2 clicked successfully!');
            updateStatus('Button 2 clicked');
        }

        function testButton3() {
            log('✅ Button 3 clicked successfully!');
            updateStatus('Button 3 clicked');
        }

        // Test if the game object exists
        function checkGameObject() {
            if (typeof game !== 'undefined') {
                log('✅ Game object exists: ' + typeof game);
                updateStatus('Game object available');
            } else {
                log('❌ Game object does not exist');
                updateStatus('Game object not available');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Page loaded, testing basic functionality...');
            updateStatus('Page loaded');
            
            // Check game object every second
            setInterval(checkGameObject, 1000);
            
            // Test button functionality immediately
            setTimeout(() => {
                log('🧪 Testing button functionality...');
                testButton1();
            }, 1000);
        });
    </script>
</body>
</html>
