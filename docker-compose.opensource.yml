# Open-source infrastructure for Infinite Match.
#
# Every service here is free/open-source software (OSI-approved licenses) and
# self-hosted. Start the whole stack with:
#
#   docker compose -f docker-compose.opensource.yml up -d
#
# License notes:
#   PostgreSQL   PostgreSQL License (OSI)
#   Valkey       BSD-3-Clause          (Redis-protocol drop-in, no RSAL/SSPL)
#   MinIO        AGPL-3.0              (S3-compatible object storage)
#   PostgREST    Apache-2.0            (REST API over PostgreSQL)
#   FerretDB     Apache-2.0            (MongoDB-wire-compatible, on Postgres;
#                                       replaces the SSPL-licensed MongoDB)
#   Prometheus   Apache-2.0
#   Grafana      AGPL-3.0
#   GlitchTip    MIT                   (Sentry-SDK-compatible error tracking;
#                                       replaces the source-available Sentry)
#   Mailpit      MIT                   (SMTP + web UI; replaces abandoned MailHog)
#   ntfy         BSD-2-Clause / GPL-2.0 (self-hosted push notifications)
#   Ollama       MIT                   (local LLMs behind an OpenAI-compatible API)

services:
  # PostgreSQL: primary relational store (economy, player data, tuning).
  postgres:
    image: postgres:17-alpine
    container_name: match3-postgres
    environment:
      POSTGRES_DB: match3game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST: the application's data API (`POSTGREST_URL`). Serves plain SQL
  # tables over HTTP — no vendor SDK, no vendor database.
  postgrest:
    image: postgrest/postgrest:latest
    container_name: match3-postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:password@postgres:5432/match3game
      PGRST_DB_ANON_ROLE: app_user
      PGRST_DB_SCHEMAS: public
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Valkey: cache, sessions, and BullMQ job broker (BSD-3, Redis-compatible).
  valkey:
    image: valkey/valkey:8-alpine
    container_name: match3-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO: S3-compatible object storage (AGPL-3.0).
  minio:
    image: minio/minio:latest
    container_name: match3-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # FerretDB: MongoDB-wire-compatible document store on PostgreSQL
  # (Apache-2.0). Drop-in for `ECONOMY_STORE=mongo` / mongoose / the mongodb
  # driver — without MongoDB's SSPL license.
  documentdb:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    container_name: match3-documentdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ferretdb
    volumes:
      - documentdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    container_name: match3-ferretdb
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://postgres:password@documentdb:5432/ferretdb
    ports:
      - "27017:27017"
    depends_on:
      documentdb:
        condition: service_healthy

  # Prometheus: metrics (replaces Datadog).
  prometheus:
    image: prom/prometheus:latest
    container_name: match3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana: dashboards (AGPL-3.0).
  grafana:
    image: grafana/grafana:latest
    container_name: match3-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # GlitchTip: error tracking that speaks the Sentry SDK protocol (MIT).
  # Point SENTRY_DSN at it — the @sentry/node SDK works unchanged.
  glitchtip-db:
    image: postgres:17-alpine
    container_name: match3-glitchtip-db
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: match3-glitchtip
    depends_on:
      - glitchtip-db
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db:5432/glitchtip
      SECRET_KEY: change-me-glitchtip-secret
      EMAIL_URL: smtp://mailpit:1025
      GLITCHTIP_DOMAIN: http://localhost:9003
      ENABLE_OPEN_USER_REGISTRATION: "true"
    ports:
      - "9003:8000"

  # PostHog: product analytics (MIT-licensed core, self-hosted). Skip with
  # `--no-deps` profiles if you prefer leaving analytics unconfigured.
  posthog:
    image: posthog/posthog:latest
    container_name: match3-posthog
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/posthog
      REDIS_URL: redis://valkey:6379
      SECRET_KEY: change-me-posthog-secret
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - valkey
    volumes:
      - posthog_data:/var/lib/posthog

  # Mailpit: SMTP catcher + web UI (MIT). Replaces abandoned MailHog.
  mailpit:
    image: axllent/mailpit:latest
    container_name: match3-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ntfy: self-hosted push notifications (used by PUSH_TRANSPORT=ntfy).
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: match3-ntfy
    command: serve
    environment:
      NTFY_BASE_URL: http://localhost:8081
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    ports:
      - "8081:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy

  # Ollama: local LLMs behind an OpenAI-compatible API (MIT). Set
  # OLLAMA_BASE_URL=http://localhost:11434 to run AI features without any
  # hosted AI vendor.
  ollama:
    image: ollama/ollama:latest
    container_name: match3-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  valkey_data:
  minio_data:
  documentdb_data:
  prometheus_data:
  grafana_data:
  glitchtip_db_data:
  posthog_data:
  ntfy_cache:
  ntfy_lib:
  ollama_models:
