<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Match - Local IAP</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Your existing game UI -->
        <div id="shop-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>🛒 Shop</h2>
                <div class="shop-items">
                    <!-- Coin Packs -->
                    <div class="shop-item">
                        <h3>Small Coin Pack</h3>
                        <p>1,000 Coins</p>
                        <p class="price">$0.99</p>
                        <button onclick="purchaseItem('coins_small', 0.99, 1000)">Buy Now</button>
                    </div>
                    
                    <div class="shop-item">
                        <h3>Medium Coin Pack</h3>
                        <p>3,000 Coins</p>
                        <p class="price">$2.99</p>
                        <button onclick="purchaseItem('coins_medium', 2.99, 3000)">Buy Now</button>
                    </div>
                    
                    <div class="shop-item">
                        <h3>Large Coin Pack</h3>
                        <p>10,000 Coins</p>
                        <p class="price">$9.99</p>
                        <button onclick="purchaseItem('coins_large', 9.99, 10000)">Buy Now</button>
                    </div>
                    
                    <!-- Gem Packs -->
                    <div class="shop-item">
                        <h3>Small Gem Pack</h3>
                        <p>50 Gems</p>
                        <p class="price">$1.99</p>
                        <button onclick="purchaseItem('gems_small', 1.99, 0, 50)">Buy Now</button>
                    </div>
                    
                    <div class="shop-item">
                        <h3>Large Gem Pack</h3>
                        <p>200 Gems</p>
                        <p class="price">$7.99</p>
                        <button onclick="purchaseItem('gems_large', 7.99, 0, 200)">Buy Now</button>
                    </div>
                    
                    <!-- Energy Packs -->
                    <div class="shop-item">
                        <h3>Energy Pack</h3>
                        <p>5 Energy</p>
                        <p class="price">$0.99</p>
                        <button onclick="purchaseItem('energy_pack', 0.99, 0, 0, 5)">Buy Now</button>
                    </div>
                </div>
                <button onclick="closeShop()">Close</button>
            </div>
        </div>
        
        <!-- Purchase Confirmation Modal -->
        <div id="purchase-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Purchase Confirmation</h2>
                <p id="purchase-details"></p>
                <div class="purchase-options">
                    <button onclick="confirmPurchase()" class="confirm-btn">Confirm Purchase</button>
                    <button onclick="cancelPurchase()" class="cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class LocalIAPGame {
            constructor() {
                this.gameState = {
                    score: 0,
                    moves: 30,
                    level: 1,
                    gems: 100,
                    coins: 1000,
                    energy: 5,
                    inventory: {
                        bomb: 3,
                        rainbow: 1,
                        lightning: 2
                    },
                    purchases: [],
                    settings: {
                        music: true,
                        sfx: true
                    }
                };
                
                this.pendingPurchase = null;
                this.init();
            }
            
            init() {
                this.loadGame();
                this.renderUI();
                this.setupEventListeners();
            }
            
            // Local IAP system - no external dependencies
            processLocalPurchase(productId, amount, coins = 0, gems = 0, energy = 0) {
                // Show purchase confirmation
                this.pendingPurchase = {
                    productId,
                    amount,
                    coins,
                    gems,
                    energy,
                    timestamp: new Date().toISOString()
                };
                
                this.showPurchaseConfirmation(productId, amount, coins, gems, energy);
            }
            
            showPurchaseConfirmation(productId, amount, coins, gems, energy) {
                const details = document.getElementById('purchase-details');
                let description = `Purchase: ${productId}<br>`;
                description += `Amount: $${amount}<br>`;
                if (coins > 0) description += `Coins: +${coins}<br>`;
                if (gems > 0) description += `Gems: +${gems}<br>`;
                if (energy > 0) description += `Energy: +${energy}<br>`;
                description += `<br><strong>This is a demo purchase. In a real game, this would process payment.</strong>`;
                
                details.innerHTML = description;
                document.getElementById('purchase-modal').style.display = 'block';
            }
            
            confirmPurchase() {
                if (this.pendingPurchase) {
                    // Add items to game
                    this.addPurchasedItems(
                        this.pendingPurchase.coins,
                        this.pendingPurchase.gems,
                        this.pendingPurchase.energy
                    );
                    
                    // Record purchase
                    this.recordPurchase(this.pendingPurchase);
                    
                    // Show success
                    this.showNotification('Purchase successful!', 'success');
                    
                    // Close modals
                    this.closePurchaseModal();
                }
            }
            
            cancelPurchase() {
                this.pendingPurchase = null;
                this.closePurchaseModal();
            }
            
            closePurchaseModal() {
                document.getElementById('purchase-modal').style.display = 'none';
                document.getElementById('shop-modal').style.display = 'none';
            }
            
            // Add purchased items
            addPurchasedItems(coins, gems, energy) {
                if (coins > 0) this.gameState.coins += coins;
                if (gems > 0) this.gameState.gems += gems;
                if (energy > 0) this.gameState.energy += energy;
                
                this.saveGame();
                this.renderUI();
            }
            
            // Record purchase
            recordPurchase(purchase) {
                this.gameState.purchases.push({
                    id: purchase.productId,
                    amount: purchase.amount,
                    coins: purchase.coins,
                    gems: purchase.gems,
                    energy: purchase.energy,
                    timestamp: purchase.timestamp,
                    type: 'local_demo'
                });
                
                this.saveGame();
            }
            
            // Save game
            saveGame() {
                localStorage.setItem('infiniteMatchLocalIAP', JSON.stringify(this.gameState));
                console.log('Game saved with local purchases!');
            }
            
            // Load game
            loadGame() {
                const saved = localStorage.getItem('infiniteMatchLocalIAP');
                if (saved) {
                    this.gameState = { ...this.gameState, ...JSON.parse(saved) };
                }
            }
            
            // Export save with purchases
            exportSave() {
                const data = JSON.stringify(this.gameState, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'infinite-match-save-with-purchases.json';
                a.click();
                URL.revokeObjectURL(url);
            }
            
            // Show notification
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: ${type === 'success' ? '#4CAF50' : type === 'error' ? '#F44336' : '#2196F3'};
                    color: white;
                    padding: 15px 20px;
                    border-radius: 5px;
                    z-index: 1000;
                    font-family: 'Fredoka', sans-serif;
                    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
            
            // Use purchased items
            useCoins(amount) {
                if (this.gameState.coins >= amount) {
                    this.gameState.coins -= amount;
                    this.saveGame();
                    this.renderUI();
                    return true;
                }
                return false;
            }
            
            useGems(amount) {
                if (this.gameState.gems >= amount) {
                    this.gameState.gems -= amount;
                    this.saveGame();
                    this.renderUI();
                    return true;
                }
                return false;
            }
            
            useEnergy(amount) {
                if (this.gameState.energy >= amount) {
                    this.gameState.energy -= amount;
                    this.saveGame();
                    this.renderUI();
                    return true;
                }
                return false;
            }
            
            // Render UI
            renderUI() {
                const scoreEl = document.getElementById('score');
                const gemsEl = document.getElementById('gems');
                const coinsEl = document.getElementById('coins');
                const energyEl = document.getElementById('energy');
                
                if (scoreEl) scoreEl.textContent = this.gameState.score;
                if (gemsEl) gemsEl.textContent = this.gameState.gems;
                if (coinsEl) coinsEl.textContent = this.gameState.coins;
                if (energyEl) energyEl.textContent = this.gameState.energy;
            }
            
            setupEventListeners() {
                const shopBtn = document.getElementById('shop-btn');
                if (shopBtn) {
                    shopBtn.addEventListener('click', () => {
                        document.getElementById('shop-modal').style.display = 'block';
                    });
                }
            }
        }
        
        // Global functions
        function closeShop() {
            document.getElementById('shop-modal').style.display = 'none';
        }
        
        function purchaseItem(productId, amount, coins = 0, gems = 0, energy = 0) {
            game.processLocalPurchase(productId, amount, coins, gems, energy);
        }
        
        function confirmPurchase() {
            game.confirmPurchase();
        }
        
        function cancelPurchase() {
            game.cancelPurchase();
        }
        
        // Initialize game
        const game = new LocalIAPGame();
        
        // Auto-save every 30 seconds
        setInterval(() => {
            game.saveGame();
        }, 30000);
    </script>
</body>
</html>
