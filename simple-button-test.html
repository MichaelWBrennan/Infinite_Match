<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
        }
        .test-button {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .log {
            background: rgba(0,0,0,0.5);
            color: #0f0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Simple Button Test</h1>
    
    <button class="test-button" onclick="testBasicFunction()">Test Basic Function</button>
    <button class="test-button" onclick="testGameObject()">Test Game Object</button>
    <button class="test-button" onclick="testScreenNavigation()">Test Screen Navigation</button>
    
    <div class="log" id="log"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function testBasicFunction() {
            log('✅ Basic function test passed!');
        }

        function testGameObject() {
            if (typeof game !== 'undefined') {
                log('✅ Game object exists: ' + typeof game);
                log('✅ Game current screen: ' + (game.currentScreen || 'unknown'));
                log('✅ Game state: ' + JSON.stringify(game.gameState || {}, null, 2));
            } else {
                log('❌ Game object does not exist');
            }
        }

        function testScreenNavigation() {
            if (typeof game !== 'undefined') {
                log('Testing screen navigation...');
                try {
                    game.showScreen('title-screen');
                    log('✅ showScreen method works');
                    log('Current screen: ' + game.currentScreen);
                } catch (error) {
                    log('❌ showScreen method failed: ' + error.message);
                }
            } else {
                log('❌ Cannot test screen navigation - game object not available');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Simple button test page loaded');
            
            // Test after a delay to allow scripts to load
            setTimeout(() => {
                log('Testing after scripts loaded...');
                testGameObject();
            }, 2000);
        });
    </script>
    
    <!-- Load the actual game scripts -->
    <script src="platform-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>
