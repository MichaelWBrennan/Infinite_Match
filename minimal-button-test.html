<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .test-button {
            background: #f39c12;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .test-button:hover {
            background: #e67e22;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Minimal Button Test</h1>
    
    <button class="test-button" onclick="testFunction('showModeSelect')">Test Mode Select</button>
    <button class="test-button" onclick="testFunction('showSettings')">Test Settings</button>
    <button class="test-button" onclick="testFunction('showTitle')">Test Title</button>
    <button class="test-button" onclick="testFunction('showNews')">Test News</button>
    <button class="test-button" onclick="testFunction('initializeGame')">Initialize Game</button>
    
    <div class="log" id="log"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function testFunction(functionName) {
            try {
                log(`Testing ${functionName}...`);
                
                if (typeof window[functionName] !== 'function') {
                    throw new Error(`Function ${functionName} does not exist`);
                }
                
                window[functionName]();
                log(`✅ ${functionName} executed successfully`);
                
            } catch (error) {
                log(`❌ ${functionName} failed: ${error.message}`);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Page loaded, checking functions...');
            setTimeout(() => {
                log('typeof game: ' + typeof game);
                log('typeof InfiniteMatchGame: ' + typeof InfiniteMatchGame);
                log('typeof showModeSelect: ' + typeof showModeSelect);
                log('typeof showSettings: ' + typeof showSettings);
                log('typeof showTitle: ' + typeof showTitle);
                log('typeof showNews: ' + typeof showNews);
                log('typeof initializeGame: ' + typeof initializeGame);
            }, 1000);
        });
    </script>
    
    <!-- Load the actual game scripts -->
    <script src="platform-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>
