<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-button {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .test-button.success {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }
        .test-button.error {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        .log {
            background: rgba(0,0,0,0.5);
            color: #0f0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Simple Button Test</h1>
        
        <div class="status" id="status">
            Status: Loading...
        </div>
        
        <div>
            <button class="test-button" onclick="testFunction('showModeSelect')">Test Mode Select</button>
            <button class="test-button" onclick="testFunction('showSettings')">Test Settings</button>
            <button class="test-button" onclick="testFunction('showTitle')">Test Title</button>
            <button class="test-button" onclick="testFunction('showNews')">Test News</button>
            <button class="test-button" onclick="testFunction('showLoginModal')">Test Login Modal</button>
        </div>
        
        <div>
            <button class="test-button" onclick="checkStatus()">Check Status</button>
            <button class="test-button" onclick="clearLog()">Clear Log</button>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = 'Status: ' + message;
        }

        function testFunction(functionName) {
            const button = event.target;
            const originalText = button.textContent;
            
            try {
                log(`Testing ${functionName}...`);
                
                // Check if function exists
                if (typeof window[functionName] !== 'function') {
                    throw new Error(`Function ${functionName} does not exist`);
                }
                
                // Call the function
                const result = window[functionName]();
                
                // Mark as success
                button.classList.add('success');
                button.textContent = '✓ ' + originalText;
                log(`✅ ${functionName} executed successfully`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('success');
                    button.textContent = originalText;
                }, 2000);
                
            } catch (error) {
                // Mark as error
                button.classList.add('error');
                button.textContent = '✗ ' + originalText;
                log(`❌ ${functionName} failed: ${error.message}`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('error');
                    button.textContent = originalText;
                }, 2000);
            }
        }

        function checkStatus() {
            log('=== STATUS CHECK ===');
            log('typeof game: ' + typeof game);
            log('typeof window.game: ' + typeof window.game);
            log('typeof InfiniteMatchGame: ' + typeof InfiniteMatchGame);
            log('typeof showModeSelect: ' + typeof showModeSelect);
            log('typeof showSettings: ' + typeof showSettings);
            log('typeof showTitle: ' + typeof showTitle);
            log('typeof showNews: ' + typeof showNews);
            log('typeof showLoginModal: ' + typeof showLoginModal);
            
            if (window.game) {
                log('Game currentScreen: ' + (window.game.currentScreen || 'undefined'));
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Simple button test page loaded');
            updateStatus('Ready for testing');
            
            // Check initial state
            setTimeout(() => {
                checkStatus();
            }, 1000);
        });
    </script>
    
    <!-- Load the actual game scripts -->
    <script src="platform-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>
