<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .test-button {
            display: block;
            margin: 10px 0;
            padding: 15px 30px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .status {
            background: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Minimal Button Test</h1>
    <p>This is a simple test to verify the main menu buttons work.</p>
    
    <button class="test-button" onclick="testButton('showModeSelect')">Test Mode Select</button>
    <button class="test-button" onclick="testButton('showSettings')">Test Settings</button>
    <button class="test-button" onclick="testButton('showLoginModal')">Test Login Modal</button>
    <button class="test-button" onclick="testButton('showNews')">Test News</button>
    
    <div class="status" id="status">Ready to test...</div>

    <script>
        function testButton(functionName) {
            const status = document.getElementById('status');
            status.innerHTML = `Testing ${functionName}...`;
            
            try {
                // Check if function exists
                if (typeof window[functionName] === 'function') {
                    window[functionName]();
                    status.innerHTML = `✅ ${functionName} called successfully!`;
                } else {
                    status.innerHTML = `❌ ${functionName} function not found`;
                }
            } catch (error) {
                status.innerHTML = `❌ ${functionName} failed: ${error.message}`;
            }
        }
        
        // Check initial state
        window.addEventListener('load', () => {
            const status = document.getElementById('status');
            status.innerHTML = `
                <strong>Initial State:</strong><br>
                window.game exists: ${!!window.game}<br>
                InfiniteMatchGame class: ${typeof InfiniteMatchGame !== 'undefined' ? 'Available' : 'Not Available'}<br>
                showModeSelect function: ${typeof showModeSelect !== 'undefined' ? 'Available' : 'Not Available'}
            `;
        });
    </script>
    
    <!-- Load the main script -->
    <script src="script.js"></script>
</body>
</html>
