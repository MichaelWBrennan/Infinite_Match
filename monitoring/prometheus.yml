global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Game Server
  - job_name: 'match3-game-server'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Node Exporter (if you want system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # Redis Exporter (if you want Redis metrics)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['host.docker.internal:9121']

  # PostgreSQL Exporter (if you want database metrics)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']