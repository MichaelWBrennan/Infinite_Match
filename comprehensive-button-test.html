<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .test-button {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .test-button.success {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }
        .test-button.error {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        .log {
            background: rgba(0,0,0,0.5);
            color: #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-family: monospace;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .test-results {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Comprehensive Button Functionality Test</h1>
        
        <div class="status" id="status">
            Status: Initializing...
        </div>
        
        <div class="test-section">
            <h2>Core Navigation Buttons</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testFunction('showModeSelect')">Mode Select</button>
                <button class="test-button" onclick="testFunction('showSettings')">Settings</button>
                <button class="test-button" onclick="testFunction('showTitle')">Title Screen</button>
                <button class="test-button" onclick="testFunction('showLevelSelect')">Level Select</button>
                <button class="test-button" onclick="testFunction('showNews')">News</button>
                <button class="test-button" onclick="testFunction('showOffers')">Offers</button>
                <button class="test-button" onclick="testFunction('showLeaderboard')">Leaderboard</button>
                <button class="test-button" onclick="testFunction('showAdvancedSettings')">Advanced Settings</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Game Control Buttons</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testFunction('startGame')">Start Game</button>
                <button class="test-button" onclick="testFunction('pauseGame')">Pause Game</button>
                <button class="test-button" onclick="testFunction('nextLevel')">Next Level</button>
                <button class="test-button" onclick="testFunction('selectLevel', 1)">Select Level 1</button>
                <button class="test-button" onclick="testFunction('selectLevel', 2)">Select Level 2</button>
                <button class="test-button" onclick="testFunction('selectLevel', 3)">Select Level 3</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Power-up Buttons</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testFunction('usePowerUp', 'bomb')">Bomb Power-up</button>
                <button class="test-button" onclick="testFunction('usePowerUp', 'rainbow')">Rainbow Power-up</button>
                <button class="test-button" onclick="testFunction('usePowerUp', 'lightning')">Lightning Power-up</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Modal and Login Buttons</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testFunction('showLoginModal')">Show Login Modal</button>
                <button class="test-button" onclick="testFunction('closeLoginModal')">Close Login Modal</button>
                <button class="test-button" onclick="testFunction('switchLoginTab', 'login')">Switch to Login Tab</button>
                <button class="test-button" onclick="testFunction('switchLoginTab', 'register')">Switch to Register Tab</button>
                <button class="test-button" onclick="testFunction('handleLogin')">Handle Login</button>
                <button class="test-button" onclick="testFunction('handleRegister')">Handle Register</button>
                <button class="test-button" onclick="testFunction('closeModal')">Close Modal</button>
                <button class="test-button" onclick="testFunction('closeTutorial')">Close Tutorial</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Platform Sync Buttons</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testFunction('syncWithPlatform', 'kongregate')">Sync Kongregate</button>
                <button class="test-button" onclick="testFunction('syncWithPlatform', 'poki')">Sync Poki</button>
                <button class="test-button" onclick="testFunction('syncWithPlatform', 'gamecrazy')">Sync Game Crazy</button>
                <button class="test-button" onclick="testFunction('syncWithPlatform', 'facebook')">Sync Facebook</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Test Controls</h2>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
            <button class="test-button" onclick="clearLog()">Clear Log</button>
            <button class="test-button" onclick="checkGameStatus()">Check Game Status</button>
            <button class="test-button" onclick="testScreenTransitions()">Test Screen Transitions</button>
        </div>
        
        <div class="test-results" id="test-results">
            <h3>Test Results</h3>
            <div id="results-summary">No tests run yet</div>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let testResults = {};
        let testCount = 0;
        let successCount = 0;
        let errorCount = 0;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = 'Status: ' + message;
        }

        function updateResults() {
            const resultsDiv = document.getElementById('results-summary');
            resultsDiv.innerHTML = `
                <p>Total Tests: ${testCount}</p>
                <p>Successful: ${successCount}</p>
                <p>Failed: ${errorCount}</p>
                <p>Success Rate: ${testCount > 0 ? ((successCount / testCount) * 100).toFixed(1) : 0}%</p>
            `;
        }

        function testFunction(functionName, ...args) {
            const button = event.target;
            const originalText = button.textContent;
            testCount++;
            
            try {
                log(`Testing ${functionName}(${args.join(', ')})...`);
                
                // Check if function exists
                if (typeof window[functionName] !== 'function') {
                    throw new Error(`Function ${functionName} does not exist`);
                }
                
                // Call the function
                const result = window[functionName](...args);
                
                // Mark as success
                button.classList.add('success');
                button.textContent = '✓ ' + originalText;
                testResults[functionName] = 'SUCCESS';
                successCount++;
                log(`✅ ${functionName} executed successfully`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('success');
                    button.textContent = originalText;
                }, 2000);
                
            } catch (error) {
                // Mark as error
                button.classList.add('error');
                button.textContent = '✗ ' + originalText;
                testResults[functionName] = 'ERROR: ' + error.message;
                errorCount++;
                log(`❌ ${functionName} failed: ${error.message}`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('error');
                    button.textContent = originalText;
                }, 2000);
            }
            
            updateResults();
        }

        function runAllTests() {
            log('Running all button tests...');
            const buttons = document.querySelectorAll('.test-button');
            let index = 0;
            
            function testNext() {
                if (index < buttons.length) {
                    const button = buttons[index];
                    if (button.textContent.includes('Run All') || button.textContent.includes('Clear') || button.textContent.includes('Check') || button.textContent.includes('Test Screen')) {
                        index++;
                        testNext();
                        return;
                    }
                    button.click();
                    index++;
                    setTimeout(testNext, 1000);
                } else {
                    log('All tests completed!');
                    showTestSummary();
                }
            }
            
            testNext();
        }

        function testScreenTransitions() {
            if (typeof game !== 'undefined') {
                log('Testing screen transitions...');
                const screens = ['title-screen', 'mode-select', 'settings-screen', 'level-select', 'news-screen', 'offers-screen', 'leaderboard-screen', 'game-screen', 'level-complete', 'advanced-settings'];
                
                let index = 0;
                function testNextScreen() {
                    if (index < screens.length) {
                        const screen = screens[index];
                        log(`Testing transition to ${screen}...`);
                        try {
                            game.showScreen(screen);
                            log(`✅ Successfully switched to ${screen}`);
                        } catch (error) {
                            log(`❌ Failed to switch to ${screen}: ${error.message}`);
                        }
                        index++;
                        setTimeout(testNextScreen, 500);
                    } else {
                        log('Screen transition tests completed!');
                    }
                }
                
                testNextScreen();
            } else {
                log('❌ Cannot test screen transitions - game object not available');
            }
        }

        function showTestSummary() {
            log('\n=== FINAL TEST SUMMARY ===');
            log(`Total tests: ${testCount}`);
            log(`Successful: ${successCount}`);
            log(`Failed: ${errorCount}`);
            log(`Success rate: ${((successCount / testCount) * 100).toFixed(1)}%`);
            
            if (errorCount > 0) {
                log('\nFailed tests:');
                Object.entries(testResults).forEach(([name, result]) => {
                    if (result !== 'SUCCESS') {
                        log(`- ${name}: ${result}`);
                    }
                });
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            testResults = {};
            testCount = 0;
            successCount = 0;
            errorCount = 0;
            updateResults();
        }

        function checkGameStatus() {
            log('Checking game status...');
            if (typeof game !== 'undefined') {
                log(`✅ Game object exists: ${typeof game}`);
                log(`✅ Current screen: ${game.currentScreen || 'unknown'}`);
                log(`✅ Game state: ${JSON.stringify(game.gameState || {}, null, 2)}`);
                
                // Check if all required methods exist
                const requiredMethods = [
                    'showModeSelect', 'showSettings', 'showTitle', 'showLevelSelect',
                    'showNews', 'showOffers', 'showLeaderboard', 'startGame',
                    'pauseGame', 'usePowerUp', 'nextLevel', 'selectLevel',
                    'showLoginModal', 'closeLoginModal', 'switchLoginTab',
                    'handleLogin', 'handleRegister', 'syncWithPlatform',
                    'closeModal', 'closeTutorial', 'showAdvancedSettings'
                ];
                
                log('Checking method availability...');
                requiredMethods.forEach(method => {
                    if (typeof game[method] === 'function') {
                        log(`✅ ${method} method exists`);
                    } else {
                        log(`❌ ${method} method missing`);
                    }
                });
            } else {
                log('❌ Game object does not exist');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Comprehensive button test page loaded');
            updateStatus('Ready for testing');
            
            // Check if game functions are available after scripts load
            setTimeout(() => {
                log('Checking function availability...');
                const requiredFunctions = [
                    'showModeSelect', 'showSettings', 'showTitle', 'showLevelSelect',
                    'showNews', 'showOffers', 'showLeaderboard', 'startGame',
                    'pauseGame', 'usePowerUp', 'nextLevel', 'selectLevel',
                    'showLoginModal', 'closeLoginModal', 'switchLoginTab',
                    'handleLogin', 'handleRegister', 'syncWithPlatform',
                    'closeModal', 'closeTutorial', 'showAdvancedSettings'
                ];
                
                requiredFunctions.forEach(func => {
                    if (typeof window[func] === 'function') {
                        log(`✅ ${func} is available`);
                    } else {
                        log(`❌ ${func} is missing`);
                    }
                });
                
                checkGameStatus();
            }, 2000);
        });
    </script>
    
    <!-- Load the actual game scripts -->
    <script src="platform-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>
