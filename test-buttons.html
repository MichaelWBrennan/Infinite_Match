<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .test-button {
            display: block;
            margin: 10px 0;
            padding: 15px 30px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .log {
            background: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Main Menu Button Test</h1>
    <p>Click the buttons below to test if they work:</p>
    
    <button class="test-button" onclick="testShowModeSelect()">Test Show Mode Select</button>
    <button class="test-button" onclick="testShowSettings()">Test Show Settings</button>
    <button class="test-button" onclick="testShowLoginModal()">Test Show Login Modal</button>
    <button class="test-button" onclick="testShowNews()">Test Show News</button>
    <button class="test-button" onclick="testShowTitle()">Test Show Title</button>
    
    <div class="log" id="log"></div>

    <script src="script.js"></script>
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function testShowModeSelect() {
            log('Testing showModeSelect...');
            try {
                showModeSelect();
                log('✅ showModeSelect called successfully');
            } catch (error) {
                log('❌ showModeSelect failed: ' + error.message);
            }
        }

        function testShowSettings() {
            log('Testing showSettings...');
            try {
                showSettings();
                log('✅ showSettings called successfully');
            } catch (error) {
                log('❌ showSettings failed: ' + error.message);
            }
        }

        function testShowLoginModal() {
            log('Testing showLoginModal...');
            try {
                showLoginModal();
                log('✅ showLoginModal called successfully');
            } catch (error) {
                log('❌ showLoginModal failed: ' + error.message);
            }
        }

        function testShowNews() {
            log('Testing showNews...');
            try {
                showNews();
                log('✅ showNews called successfully');
            } catch (error) {
                log('❌ showNews failed: ' + error.message);
            }
        }

        function testShowTitle() {
            log('Testing showTitle...');
            try {
                showTitle();
                log('✅ showTitle called successfully');
            } catch (error) {
                log('❌ showTitle failed: ' + error.message);
            }
        }

        // Log initial state
        log('Page loaded. Checking game state...');
        log('window.game exists: ' + !!window.game);
        log('InfiniteMatchGame class exists: ' + (typeof InfiniteMatchGame !== 'undefined'));
        
        // Wait a bit and check again
        setTimeout(() => {
            log('After 1 second:');
            log('window.game exists: ' + !!window.game);
            if (window.game) {
                log('Game methods available: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(window.game)).join(', '));
            }
        }, 1000);
    </script>
</body>
</html>
