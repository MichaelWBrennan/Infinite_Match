<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Functionality Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .test-button {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .test-button.success {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }
        .test-button.error {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        .log {
            background: rgba(0,0,0,0.5);
            color: #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Button Functionality Test</h1>
        
        <div class="status" id="status">
            Status: Initializing...
        </div>
        
        <div class="test-section">
            <h2>Navigation Buttons Test</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testButton('showModeSelect')">Mode Select</button>
                <button class="test-button" onclick="testButton('showSettings')">Settings</button>
                <button class="test-button" onclick="testButton('showTitle')">Title Screen</button>
                <button class="test-button" onclick="testButton('showLevelSelect')">Level Select</button>
                <button class="test-button" onclick="testButton('showNews')">News</button>
                <button class="test-button" onclick="testButton('showOffers')">Offers</button>
                <button class="test-button" onclick="testButton('showLeaderboard')">Leaderboard</button>
                <button class="test-button" onclick="testButton('showAdvancedSettings')">Advanced Settings</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Game Control Buttons Test</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testButton('startGame')">Start Game</button>
                <button class="test-button" onclick="testButton('pauseGame')">Pause Game</button>
                <button class="test-button" onclick="testButton('nextLevel')">Next Level</button>
                <button class="test-button" onclick="testButton('selectLevel', 1)">Select Level 1</button>
                <button class="test-button" onclick="testButton('selectLevel', 2)">Select Level 2</button>
                <button class="test-button" onclick="testButton('selectLevel', 3)">Select Level 3</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Power-up Buttons Test</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testButton('usePowerUp', 'bomb')">Bomb Power-up</button>
                <button class="test-button" onclick="testButton('usePowerUp', 'rainbow')">Rainbow Power-up</button>
                <button class="test-button" onclick="testButton('usePowerUp', 'lightning')">Lightning Power-up</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Modal Buttons Test</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testButton('showLoginModal')">Show Login Modal</button>
                <button class="test-button" onclick="testButton('closeLoginModal')">Close Login Modal</button>
                <button class="test-button" onclick="testButton('switchLoginTab', 'login')">Switch to Login Tab</button>
                <button class="test-button" onclick="testButton('switchLoginTab', 'register')">Switch to Register Tab</button>
                <button class="test-button" onclick="testButton('handleLogin')">Handle Login</button>
                <button class="test-button" onclick="testButton('handleRegister')">Handle Register</button>
                <button class="test-button" onclick="testButton('closeModal')">Close Modal</button>
                <button class="test-button" onclick="testButton('closeTutorial')">Close Tutorial</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Platform Sync Buttons Test</h2>
            <div class="button-grid">
                <button class="test-button" onclick="testButton('syncWithPlatform', 'kongregate')">Sync Kongregate</button>
                <button class="test-button" onclick="testButton('syncWithPlatform', 'poki')">Sync Poki</button>
                <button class="test-button" onclick="testButton('syncWithPlatform', 'gamecrazy')">Sync Game Crazy</button>
                <button class="test-button" onclick="testButton('syncWithPlatform', 'facebook')">Sync Facebook</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Test Controls</h2>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
            <button class="test-button" onclick="clearLog()">Clear Log</button>
            <button class="test-button" onclick="checkGameStatus()">Check Game Status</button>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let testResults = {};
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = 'Status: ' + message;
        }

        function testButton(functionName, ...args) {
            const button = event.target;
            const originalText = button.textContent;
            
            try {
                log(`Testing ${functionName}(${args.join(', ')})...`);
                
                // Check if function exists
                if (typeof window[functionName] !== 'function') {
                    throw new Error(`Function ${functionName} does not exist`);
                }
                
                // Call the function
                const result = window[functionName](...args);
                
                // Mark as success
                button.classList.add('success');
                button.textContent = '✓ ' + originalText;
                testResults[functionName] = 'SUCCESS';
                log(`✅ ${functionName} executed successfully`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('success');
                    button.textContent = originalText;
                }, 2000);
                
            } catch (error) {
                // Mark as error
                button.classList.add('error');
                button.textContent = '✗ ' + originalText;
                testResults[functionName] = 'ERROR: ' + error.message;
                log(`❌ ${functionName} failed: ${error.message}`);
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.classList.remove('error');
                    button.textContent = originalText;
                }, 2000);
            }
        }

        function runAllTests() {
            log('Running all button tests...');
            const buttons = document.querySelectorAll('.test-button');
            let index = 0;
            
            function testNext() {
                if (index < buttons.length) {
                    const button = buttons[index];
                    if (button.textContent.includes('Run All') || button.textContent.includes('Clear') || button.textContent.includes('Check')) {
                        index++;
                        testNext();
                        return;
                    }
                    button.click();
                    index++;
                    setTimeout(testNext, 1000);
                } else {
                    log('All tests completed!');
                    showTestSummary();
                }
            }
            
            testNext();
        }

        function showTestSummary() {
            log('\n=== TEST SUMMARY ===');
            const totalTests = Object.keys(testResults).length;
            const successCount = Object.values(testResults).filter(r => r === 'SUCCESS').length;
            const errorCount = totalTests - successCount;
            
            log(`Total tests: ${totalTests}`);
            log(`Successful: ${successCount}`);
            log(`Failed: ${errorCount}`);
            log(`Success rate: ${((successCount / totalTests) * 100).toFixed(1)}%`);
            
            if (errorCount > 0) {
                log('\nFailed tests:');
                Object.entries(testResults).forEach(([name, result]) => {
                    if (result !== 'SUCCESS') {
                        log(`- ${name}: ${result}`);
                    }
                });
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            testResults = {};
        }

        function checkGameStatus() {
            log('Checking game status...');
            if (typeof game !== 'undefined') {
                log(`✅ Game object exists: ${typeof game}`);
                log(`✅ Current screen: ${game.currentScreen || 'unknown'}`);
                log(`✅ Game state: ${JSON.stringify(game.gameState || {}, null, 2)}`);
            } else {
                log('❌ Game object does not exist');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Button test page loaded');
            updateStatus('Ready for testing');
            
            // Check if game functions are available
            setTimeout(() => {
                const requiredFunctions = [
                    'showModeSelect', 'showSettings', 'showTitle', 'showLevelSelect',
                    'showNews', 'showOffers', 'showLeaderboard', 'startGame',
                    'pauseGame', 'usePowerUp', 'nextLevel', 'selectLevel',
                    'showLoginModal', 'closeLoginModal', 'switchLoginTab',
                    'handleLogin', 'handleRegister', 'syncWithPlatform',
                    'closeModal', 'closeTutorial', 'showAdvancedSettings'
                ];
                
                log('Checking function availability...');
                requiredFunctions.forEach(func => {
                    if (typeof window[func] === 'function') {
                        log(`✅ ${func} is available`);
                    } else {
                        log(`❌ ${func} is missing`);
                    }
                });
                
                checkGameStatus();
            }, 1000);
        });
    </script>
    
    <!-- Load the actual game scripts -->
    <script src="platform-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>
