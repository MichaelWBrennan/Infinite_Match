<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Infinite Match - Industry Leading Match 3 Game">
    <title>Infinite Match - Match 3 Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    
    <!-- Shared UI Styles -->
    <link rel="stylesheet" href="shared-ui.css">
    
    <!-- Mobile WebGL Styles -->
    <style>
        .mobile-warning-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .mobile-warning-content h3 {
            margin: 0 0 15px 0;
            font-size: 24px;
            font-weight: bold;
        }
        
        .mobile-warning-content p {
            margin: 0 0 20px 0;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .mobile-optimization-status {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 14px;
        }
        
        .status-label {
            font-weight: 500;
        }
        
        .status-value {
            font-weight: bold;
            color: #4CAF50;
        }
        
        .unity-mobile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        
        .unity-mobile #unity-canvas {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            .mobile-optimization-status {
                flex-direction: column;
            }
            
            .status-item {
                flex-direction: column;
                text-align: center;
                gap: 5px;
            }
        }
    </style>
    
    <!-- Platform-specific SDK will be loaded here -->
    <script id="platform-sdk-loader"></script>
    
    <!-- Analytics SDKs -->
    <script src="https://cdn.amplitude.com/libs/analytics-browser-2.26.0-min.js.gz"></script>
    <script src="https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js"></script>
    <script src="https://browser.sentry-cdn.com/7.114.0/bundle.tracing.min.js"></script>
    <script src="https://browser.sentry-cdn.com/7.114.0/bundle.min.js"></script>
    <script src="https://www.datadoghq-browser-agent.com/us1/v6/datadog-rum.js"></script>
    
    <!-- Platform Detection -->
    <script src="platform-detection.js"></script>
    
    <!-- Mobile WebGL Support -->
    <script src="mobile-webgl-support.js"></script>
    
    <!-- Shared Game Logic -->
    <script src="shared-game.js"></script>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="loading-text">Loading Infinite Match...</div>
        </div>
        <div id="unity-mobile-warning" style="display: none;">
            <div class="mobile-warning-content">
                <h3>📱 Mobile WebGL Support</h3>
                <p>This game now supports mobile devices! Optimizing for your device...</p>
                <div class="mobile-optimization-status">
                    <div class="status-item">
                        <span class="status-label">Device Detection:</span>
                        <span class="status-value" id="device-status">Checking...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Performance Level:</span>
                        <span class="status-value" id="performance-status">Detecting...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Touch Support:</span>
                        <span class="status-value" id="touch-status">Enabling...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Game UI Elements -->
        <div class="game-ui">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="level">Level: <span id="level">1</span></div>
            <div class="moves">Moves: <span id="moves">30</span></div>
        </div>
        
        <div class="game-controls">
            <button class="btn" onclick="startNewGame()">New Game</button>
            <button class="btn secondary" onclick="pauseGame()">Pause</button>
            <button class="btn success" onclick="usePowerUp()">Power Up</button>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Level Reached: <span id="finalLevel">1</span></p>
            <button class="btn" onclick="startNewGame()">Play Again</button>
        </div>
        
        <div class="particles" id="particles"></div>
    </div>
    
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var mobileWarning = document.querySelector("#unity-mobile-warning");
        
        // Platform Integration
        var platformAPI = null;
        var gameInstance = null;
        var platformDetector = null;
        var platformConfig = null;
        
        // Analytics Integration
        var analytics = {
            amplitude: null,
            mixpanel: null,
            sentry: null,
            datadog: null,
            sessionId: null,
            initialized: false
        };
        
        // Load platform-specific configuration
        async function loadPlatformConfig() {
            try {
                // Try to load platform config from current directory
                const response = await fetch('platform-config.json');
                if (response.ok) {
                    platformConfig = await response.json();
                    console.log('✅ Platform config loaded:', platformConfig.platform);
                    
                    // Update page title and description based on platform
                    if (platformConfig.name) {
                        document.title = `Infinite Match - ${platformConfig.name}`;
                    }
                    if (platformConfig.description) {
                        document.querySelector('meta[name="description"]').setAttribute('content', platformConfig.description);
                    }
                } else {
                    // Fallback to default config
                    platformConfig = {
                        platform: 'default',
                        name: 'Default',
                        features: {
                            ads: false,
                            iap: false,
                            social: false,
                            analytics: true
                        }
                    };
                    console.log('⚠️ Using default platform config');
                }
            } catch (error) {
                console.error('❌ Failed to load platform config:', error);
                // Use default config
                platformConfig = {
                    platform: 'default',
                    name: 'Default',
                    features: {
                        ads: false,
                        iap: false,
                        social: false,
                        analytics: true
                    }
                };
            }
        }
        
        // Load platform-specific SDK
        function loadPlatformSDK() {
            const sdkLoader = document.getElementById('platform-sdk-loader');
            
            if (!platformConfig || !platformConfig.sdkUrl) {
                console.log('⚠️ No platform SDK URL, skipping SDK load');
                return;
            }
            
            sdkLoader.src = platformConfig.sdkUrl;
            sdkLoader.onload = () => {
                console.log('✅ Platform SDK loaded:', platformConfig.platform);
            };
            sdkLoader.onerror = () => {
                console.error('❌ Failed to load platform SDK:', platformConfig.platform);
            };
        }
        
        // Initialize Analytics
        function initializeAnalytics() {
            try {
                analytics.sessionId = 'webgl_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Initialize Amplitude
                if (typeof amplitude !== 'undefined') {
                    analytics.amplitude = amplitude;
                    analytics.amplitude.init('YOUR_AMPLITUDE_API_KEY', null, {
                        saveEvents: true,
                        includeUtm: true,
                        includeReferrer: true
                    });
                    console.log('✅ Amplitude initialized');
                }
                
                // Initialize Mixpanel
                if (typeof mixpanel !== 'undefined') {
                    analytics.mixpanel = mixpanel;
                    analytics.mixpanel.init('YOUR_MIXPANEL_TOKEN');
                    console.log('✅ Mixpanel initialized');
                }
                
                // Initialize Sentry
                if (typeof Sentry !== 'undefined') {
                    analytics.sentry = Sentry;
                    analytics.sentry.init({
                        dsn: 'YOUR_SENTRY_DSN',
                        environment: 'production',
                        tracesSampleRate: 1.0
                    });
                    console.log('✅ Sentry initialized');
                }
                
                // Initialize Datadog RUM
                if (typeof DD_RUM !== 'undefined') {
                    analytics.datadog = DD_RUM;
                    analytics.datadog.init({
                        applicationId: 'YOUR_DATADOG_APP_ID',
                        clientToken: 'YOUR_DATADOG_CLIENT_TOKEN',
                        site: 'datadoghq.com',
                        service: 'match3-game-webgl',
                        env: 'production',
                        version: '1.0.0',
                        sessionSampleRate: 100,
                        sessionReplaySampleRate: 20,
                        trackUserInteractions: true,
                        trackResources: true,
                        trackLongTasks: true
                    });
                    console.log('✅ Datadog RUM initialized');
                }
                
                analytics.initialized = true;
                console.log('✅ Analytics initialized successfully');
                
            } catch (error) {
                console.error('❌ Analytics initialization failed:', error);
            }
        }
        
        // Track game events
        function trackEvent(eventName, properties = {}) {
            if (!analytics.initialized) return;
            
            try {
                const eventData = {
                    ...properties,
                    session_id: analytics.sessionId,
                    timestamp: new Date().toISOString(),
                    platform: platformConfig ? platformConfig.platform : 'unknown',
                    game_version: '1.0.0'
                };
                
                if (analytics.amplitude) {
                    analytics.amplitude.track(eventName, eventData);
                }
                
                if (analytics.mixpanel) {
                    analytics.mixpanel.track(eventName, eventData);
                }
                
                if (analytics.datadog) {
                    analytics.datadog.addAction(eventName, eventData);
                }
                
                console.log('📊 Event tracked:', eventName, eventData);
            } catch (error) {
                console.error('Failed to track event:', error);
            }
        }
        
        // Initialize Platform Detection and SDK
        async function initializePlatform() {
            try {
                // Load platform config first
                await loadPlatformConfig();
                
                // Load platform-specific SDK
                loadPlatformSDK();
                
                // Initialize analytics
                initializeAnalytics();
                
                // Initialize platform detector
                platformDetector = new PlatformDetector();
                const platformInfo = await platformDetector.initialize();
                
                console.log(`🎮 Platform: ${platformInfo.config.name}`);
                console.log(`📱 Features:`, platformInfo.config.features);
                
                platformAPI = platformDetector.getUnifiedAPI();
                
                // Track platform initialization
                trackEvent('platform_initialized', {
                    platform: platformInfo.config.name,
                    features: platformInfo.config.features
                });
                
                startGame();
            } catch (error) {
                console.error('❌ Platform initialization failed:', error);
                showError('Failed to initialize platform: ' + error.message);
            }
        }
        
        // Start the game
        function startGame() {
            // Check if mobile device and enable mobile WebGL support
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                mobileWarning.style.display = "block";
                
                // Initialize mobile WebGL support
                if (window.MobileWebGLSupport) {
                    MobileWebGLSupport.init();
                    
                    // Update mobile status
                    updateMobileStatus();
                    
                    // Start mobile-optimized game
                    startMobileGame();
                } else {
                    console.warn('⚠️ Mobile WebGL support not available, using fallback');
                    startFallbackGame();
                }
                return;
            } else {
                // Responsive canvas sizing
                const maxWidth = Math.min(window.innerWidth - 40, 960);
                const maxHeight = Math.min(window.innerHeight - 40, 600);
                const aspectRatio = 960 / 600;
                
                let canvasWidth = maxWidth;
                let canvasHeight = maxWidth / aspectRatio;
                
                if (canvasHeight > maxHeight) {
                    canvasHeight = maxHeight;
                    canvasWidth = maxHeight * aspectRatio;
                }
                
                canvas.style.width = canvasWidth + "px";
                canvas.style.height = canvasHeight + "px";
            }
            
            loadingBar.style.display = "block";
            
            // Load Unity WebGL build
            loadUnityWebGL();
        }
        
        // Load Unity WebGL build
        function loadUnityWebGL() {
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/WebGL.loader.js";
            
            // Load the Unity loader script
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                console.log('📦 Unity loader loaded, initializing...');
                
                // Create Unity instance with progress callback
                if (typeof createUnityInstance === 'function') {
                    createUnityInstance(canvas, {}, (progress) => {
                        progressBarFull.style.width = 100 * progress + "%";
                        console.log('📊 Loading progress:', Math.round(progress * 100) + '%');
                    }).then((unityInstance) => {
                        gameInstance = unityInstance;
                        loadingBar.style.display = "none";
                        
                        // Set up fullscreen functionality
                        if (unityInstance.SetFullscreen) {
                            canvas.addEventListener('dblclick', () => {
                                unityInstance.SetFullscreen(1);
                            });
                        }
                        
                        // Start the game
                        if (unityInstance.start) {
                            unityInstance.start();
                        }
                        
                        // Platform game ready callback
                        if (platformAPI) {
                            platformAPI.gameplayStart();
                        }
                        
                        // Track game loaded
                        trackEvent('game_loaded', {
                            load_time: Date.now() - window.performance.timing.navigationStart,
                            platform: platformConfig ? platformConfig.platform : 'unknown'
                        });
                        
                        console.log('✅ Unity game loaded successfully');
                    }).catch((message) => {
                        console.error('❌ Unity game load failed:', message);
                        console.log('🔄 Falling back to Match 3 game...');
                        startFallbackGame();
                    });
                } else {
                    console.error('❌ createUnityInstance function not found');
                    showError('Unity loader not properly loaded');
                }
            };
            
            script.onerror = () => {
                console.error('❌ Failed to load Unity WebGL loader');
                console.log('🔄 Falling back to Match 3 game...');
                startFallbackGame();
            };
            
            document.body.appendChild(script);
        }
        
        // Start mobile-optimized game
        function startMobileGame() {
            console.log('📱 Starting mobile-optimized WebGL game...');
            
            // Set mobile-specific settings
            if (window.MobileWebGLSupport) {
                const deviceInfo = MobileWebGLSupport.getDeviceInfo();
                console.log('📱 Device Info:', deviceInfo);
                
                // Update status display
                updateMobileStatus();
            }
            
            // Load Unity WebGL build with mobile optimizations
            loadUnityWebGLMobile();
        }
        
        // Update mobile status display
        function updateMobileStatus() {
            if (!window.MobileWebGLSupport) return;
            
            const deviceInfo = MobileWebGLSupport.getDeviceInfo();
            const isMobile = MobileWebGLSupport.isMobileDevice;
            
            document.getElementById('device-status').textContent = isMobile ? 'Mobile Detected' : 'Desktop Detected';
            document.getElementById('performance-status').textContent = deviceInfo ? deviceInfo.platform : 'Unknown';
            document.getElementById('touch-status').textContent = deviceInfo && deviceInfo.touchSupport ? 'Enabled' : 'Disabled';
        }
        
        // Load Unity WebGL build with mobile optimizations
        function loadUnityWebGLMobile() {
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/WebGL.loader.js";
            
            // Load the Unity loader script
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                console.log('📦 Unity loader loaded for mobile, initializing...');
                
                // Create Unity instance with mobile optimizations
                if (typeof createUnityInstance === 'function') {
                    const mobileConfig = {
                        dataUrl: buildUrl + "/WebGL.data",
                        frameworkUrl: buildUrl + "/WebGL.framework.js",
                        codeUrl: buildUrl + "/WebGL.wasm",
                        streamingAssetsUrl: "StreamingAssets",
                        companyName: "Infinite Match",
                        productName: "Infinite Match",
                        productVersion: "1.0.0",
                        matchWebGLToCanvasSize: false,
                        devicePixelRatio: window.devicePixelRatio || 1
                    };
                    
                    createUnityInstance(canvas, mobileConfig, (progress) => {
                        progressBarFull.style.width = 100 * progress + "%";
                        console.log('📊 Mobile loading progress:', Math.round(progress * 100) + '%');
                    }).then((unityInstance) => {
                        gameInstance = unityInstance;
                        loadingBar.style.display = "none";
                        mobileWarning.style.display = "none";
                        
                        // Set up mobile-specific features
                        setupMobileFeatures(unityInstance);
                        
                        // Start the game
                        if (unityInstance.start) {
                            unityInstance.start();
                        }
                        
                        // Platform game ready callback
                        if (platformAPI) {
                            platformAPI.gameplayStart();
                        }
                        
                        // Track mobile game loaded
                        trackEvent('mobile_game_loaded', {
                            load_time: Date.now() - window.performance.timing.navigationStart,
                            platform: platformConfig ? platformConfig.platform : 'unknown',
                            device_info: MobileWebGLSupport.getDeviceInfo()
                        });
                        
                        console.log('✅ Mobile Unity game loaded successfully');
                    }).catch((message) => {
                        console.error('❌ Mobile Unity game load failed:', message);
                        console.log('🔄 Falling back to Match 3 game...');
                        startFallbackGame();
                    });
                } else {
                    console.error('❌ createUnityInstance function not found');
                    showError('Unity loader not properly loaded');
                }
            };
            
            script.onerror = () => {
                console.error('❌ Failed to load Unity WebGL loader for mobile');
                console.log('🔄 Falling back to Match 3 game...');
                startFallbackGame();
            };
            
            document.body.appendChild(script);
        }
        
        // Set up mobile-specific features
        function setupMobileFeatures(unityInstance) {
            // Set up touch events
            if (window.MobileWebGLSupport) {
                // Enable touch optimizations
                MobileWebGLSupport.enableTouchOptimizations();
                
                // Set up gesture recognition
                MobileWebGLSupport.setupGestureRecognition();
            }
            
            // Set up mobile-specific Unity communication
            if (unityInstance.SendMessage) {
                // Send mobile device info to Unity
                const deviceInfo = MobileWebGLSupport.getDeviceInfo();
                unityInstance.SendMessage('MobileWebGLSupport', 'SetDeviceInfo', JSON.stringify(deviceInfo));
                
                // Set mobile quality
                unityInstance.SendMessage('MobileWebGLSupport', 'SetMobileQuality', '1');
                
                // Set mobile frame rate
                unityInstance.SendMessage('MobileWebGLSupport', 'SetMobileFrameRate', '30');
            }
        }
        
        // Start fallback Match 3 game
        function startFallbackGame() {
            console.log('🎮 Starting Match 3 fallback game...');
            
            // Hide Unity canvas and loading bar
            const canvas = document.querySelector('#unity-canvas');
            const loadingBar = document.querySelector('#unity-loading-bar');
            
            if (canvas) canvas.style.display = 'none';
            if (loadingBar) loadingBar.style.display = 'none';
            
            // Initialize the Match 3 game
            if (typeof SharedMatch3Game !== 'undefined') {
                window.sharedGame = new SharedMatch3Game();
                console.log('✅ Match 3 game started successfully');
            } else {
                console.error('❌ SharedMatch3Game class not found');
                showError('Failed to load game. Please refresh the page.');
            }
        }
        
        // Show error message
        function showError(message) {
            loadingBar.innerHTML = '<div class="poki-error">' + message + '</div>';
        }
        
        // Platform event handlers
        function onGamePause() {
            if (platformAPI) {
                platformAPI.gameplayStop();
            }
            trackEvent('game_paused', {
                level: 1, // This would come from Unity
                score: 0  // This would come from Unity
            });
        }
        
        function onGameResume() {
            if (platformAPI) {
                platformAPI.gameplayStart();
            }
            trackEvent('game_resumed', {
                level: 1, // This would come from Unity
                score: 0  // This would come from Unity
            });
        }
        
        function onGameQuit() {
            if (platformAPI) {
                platformAPI.gameplayStop();
            }
            trackEvent('game_quit', {
                session_duration: Date.now() - window.performance.timing.navigationStart,
                level: 1, // This would come from Unity
                score: 0  // This would come from Unity
            });
        }
        
        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                onGamePause();
            } else {
                onGameResume();
            }
        });
        
        // Handle page unload
        window.addEventListener('beforeunload', function() {
            onGameQuit();
        });
        
        // Initialize when page loads
        window.addEventListener('load', function() {
            initializePlatform();
        });
        
        // Unified Platform API for Unity
        window.GameAPI = {
            // Show ad
            showAd: function(type) {
                if (platformAPI) {
                    return platformAPI.showAd(type);
                }
                return Promise.resolve();
            },
            
            // Show rewarded ad
            showRewardedAd: function() {
                if (platformAPI) {
                    return platformAPI.showRewardedAd();
                }
                return Promise.resolve();
            },
            
            // Show interstitial ad
            showInterstitialAd: function() {
                if (platformAPI) {
                    return platformAPI.showInterstitialAd();
                }
                return Promise.resolve();
            },
            
            // Check if ad is blocked
            isAdBlocked: function() {
                if (platformAPI) {
                    return platformAPI.isAdBlocked();
                }
                return false;
            },
            
            // Check if user has ad-free
            isAdFree: function() {
                if (platformAPI) {
                    return platformAPI.isAdFree();
                }
                return false;
            },
            
            // Track game event
            trackEvent: function(eventName, data) {
                if (platformAPI) {
                    platformAPI.trackEvent(eventName, data);
                }
                // Also track with our analytics
                trackEvent(eventName, data);
            },
            
            // Get user info
            getUserInfo: function() {
                if (platformAPI) {
                    return platformAPI.getUserInfo();
                }
                return null;
            },
            
            // Get platform info
            getPlatform: function() {
                if (platformAPI) {
                    return platformAPI.getPlatform();
                }
                return platformConfig ? platformConfig.platform : 'unknown';
            },
            
            // Get platform name
            getPlatformName: function() {
                if (platformAPI) {
                    return platformAPI.getPlatformName();
                }
                return platformConfig ? platformConfig.name : 'Unknown';
            },
            
            // Get available features
            getFeatures: function() {
                if (platformAPI) {
                    return platformAPI.getFeatures();
                }
                return platformConfig ? platformConfig.features : {};
            }
        };
        
        // Legacy Poki API for backward compatibility
        window.PokiAPI = window.GameAPI;
    </script>
</body>
</html>
